<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Hop Games</title>
    <meta name="description" content="Pocket Hop Games makes small, relaxing puzzle games for your pocket." />
    <style>
      :root { --bg: #1b1f3b; --card: #262b52; --text: #f4f5ff; --muted: #a6abd6; --accent: #ffb938; }
      * { box-sizing: border-box; }
      body { margin: 0; background: radial-gradient(ellipse at top, #2e3570, var(--bg) 70%) fixed; color: var(--text);
        font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
      main { max-width: 720px; margin: 0 auto; padding: 56px 20px; }
      h1 { font-size: 44px; margin: 0; letter-spacing: .5px; }
      .tag { color: var(--muted); margin: 6px 0 40px; }
      h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); }
      .game { display: flex; gap: 20px; align-items: center; background: var(--card); border-radius: 22px; padding: 20px; }
      .game img { width: 96px; height: 96px; border-radius: 22px; flex: none; }
      .game h3 { margin: 0 0 4px; font-size: 22px; }
      .game p { margin: 0 0 8px; color: var(--muted); }
      a { color: #4fc3f7; }
      footer { margin-top: 56px; color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pocket Hop Games</h1>
      <p class="tag">Small, relaxing puzzle games for your pocket.</p>

      <h2>Games</h2>
      <div class="game">
        <img src="gravity-sort/icon.png" alt="Gravity Sort icon" />
        <div>
          <h3>Gravity Sort: Tilt Puzzle</h3>
          <p>Tilt the board and roll every ball into its matching hole. Coming soon to Google Play.</p>
          <a href="gravity-sort/privacy.html">Privacy Policy</a>
        </div>
      </div>

      <footer>
        Contact: <a href="mailto:pockthopgames@gmail.com">pockthopgames@gmail.com</a><br />
        © 2026 Pocket Hop Games
      </footer>
    </main>
  </body>
</html>
